# HTB profile stats — update when your profile changes
htb:
  - { key: "rank",       value: "Prodigy", color: "green" }
  - { key: "level",      value: "79",      color: "green" }
  - { key: "machines",   value: "42",      color: "cyan" }
  - { key: "sherlocks",  value: "54",      color: "cyan" }
  - { key: "challenges", value: "69",      color: "cyan" }
  - { key: "season 9",   value: "Ruby",    color: "red" }

# Certifications. `page` = slug of a page in content/certs/ (card links there).
# Without `page`, the card links straight to the external verify URL.
certs:
  - { name: "eCTHP",    full: "Certified Threat Hunting Professional",     issuer: "INE",              year: "2026", side: "intel",  page: "ecthp" }
  - { name: "eCIR",     full: "Certified Incident Responder",              issuer: "INE",              year: "2026", side: "blue",   page: "ecir" }
  - { name: "CRTP",     full: "Certified Red Team Professional",           issuer: "Altered Security", year: "2026", side: "red", page: "crtp" }
  - { name: "eCPPTv3",  full: "Certified Professional Penetration Tester", issuer: "INE",              year: "2026", side: "red",    page: "ecpptv3" }
  - { name: "eJPTv3",   full: "Junior Penetration Tester",                 issuer: "INE",              year: "2025", side: "red",    page: "ejptv3" }

