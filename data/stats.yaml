  - { name: "eCPPTv3",  full: "Certified Professional Penetration Tester", issuer: "INE",              year: "2026", side: "red",    page: "ecpptv3" }
  - { name: "eJPTv3",   full: "Junior Penetration Tester",                 issuer: "INE",              year: "2025", side: "red",    page: "ejptv3" }
  - { name: "CTI",      full: "Threat Intelligence Analyst (Foundation)",  issuer: "arcX",             year: "2025", side: "blue",   url: "https://arcx.io/verify-certificate?id=dee5f2a94e9efe9e3a877e9314c79cb09d2fd8b1&k=28c6a9eee96e4fb0853abc11ac17447c" }
  - { name: "CCNA 1-3", full: "Cisco Certified Network Associate 1-3",     issuer: "Cisco",            year: "2024", side: "blue",   page: "ccna" }

