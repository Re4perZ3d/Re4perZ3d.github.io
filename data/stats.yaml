# HTB profile stats — update when your profile changes
htb:
  - { key: "rank",       value: "Prodigy", color: "green" }
  - { key: "level",      value: "78",      color: "green" }
  - { key: "machines",   value: "41",      color: "cyan" }
  - { key: "sherlocks",  value: "50",      color: "cyan" }
  - { key: "challenges", value: "66",      color: "cyan" }
