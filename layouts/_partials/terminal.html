<div class="term-wrap">
  <form class="term" id="term" autocomplete="off" aria-label="Interactive terminal">
    <label class="term-line">
      {{ partial "prompt.html" "~" }}
      <input id="term-in" type="text" spellcheck="false" aria-label="Type a command, try help" placeholder="type 'help' — try 'matrix'">
    </label>
    <div class="term-out" id="term-out" aria-live="polite"></div>
  </form>
  <script type="application/json" id="term-data">
    {{- $pages := slice -}}
    {{- range site.RegularPages -}}
      {{- $pages = $pages | append (dict "title" .Title "url" .RelPermalink "section" .Section) -}}
    {{- end -}}
    {{- dict "pages" $pages "github" site.Params.github "linkedin" site.Params.linkedin "htb" site.Params.hackthebox "email" site.Params.email "resume" (site.Params.resume | relURL) "name" site.Params.name | jsonify | safeJS -}}
  </script>
  <div class="term-hints" aria-label="Quick commands">
    {{ range slice "help" "neofetch" "ctf" "projects" "matrix" "social" }}
    <button type="button" class="hint" data-term-run="{{ . }}">{{ . }}</button>
    {{ end }}
  </div>
</div>
